[package]
name = "daymark"
version = "0.1.0"
edition = "2024"
description = "A quiet screen time journal for GNOME"
license = "MIT"
rust-version = "1.85"

[features]
default = []
# Optional X11 window backend for Ubuntu GNOME on Xorg (adds about 0.7 MB).
x11 = ["slint/backend-winit-x11"]

[dependencies]
slint = { version = "=1.8.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-software",
    "software-renderer-systemfonts",
] }
rusqlite = { version = "0.37", default-features = false }
libc = "0.2"
png = "0.18"

[build-dependencies]
slint-build = "=1.8.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# A tiny local backport: Slint 1.8 does not expose the native window-move hook
# that later versions use for custom frameless title bars. The two vendored
# crates are unmodified upstream sources except for a no-op trait hook,
# Window::start_window_move(), and the winit implementation calling drag_window.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
