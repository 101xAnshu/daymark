name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm file

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Release build
        run: cargo build --release --locked

      - name: Build Debian package
        run: scripts/build-deb.sh --skip-build

      - name: Build RPM package
        run: scripts/build-rpm.sh --skip-build

      - name: Build portable archive
        run: scripts/build-tarball.sh --skip-build

      - name: Write checksums
        run: |
          cd dist
          sha256sum \
            daymark_*_amd64.deb \
            daymark-*-1.x86_64.rpm \
            daymark-*-x86_64-linux.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Read version
        id: version
        run: |
          version="$(awk '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version *=/ {
              gsub(/.*version *= *"|".*/, "", $0)
              print
              exit
            }
          ' Cargo.toml)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" \
              --draft \
              --title "Daymark ${tag#v}" \
              --generate-notes \
              dist/*
          fi

      - name: Summarize
        run: |
          {
            echo "Draft release: ${GITHUB_REF_NAME}"
            echo
            echo "Assets:"
            echo "- \`daymark_${{ steps.version.outputs.version }}_amd64.deb\` (Ubuntu 22.04+ amd64)"
            echo "- \`daymark-${{ steps.version.outputs.version }}-1.x86_64.rpm\` (Fedora 42+ x86_64)"
            echo "- \`daymark-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz\` (per-user fallback)"
            echo "- \`SHA256SUMS\`"
          } >>"$GITHUB_STEP_SUMMARY"
